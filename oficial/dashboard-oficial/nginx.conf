server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: cualquier ruta no-archivo cae a index.html (React Router-like).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy a la API en la red Docker rrv-net.
    location /api/ {
        proxy_pass http://oficial_api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /health {
        proxy_pass http://oficial_api:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
