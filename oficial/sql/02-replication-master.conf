# ============================================================
# 02-replication-master.conf
# Settings de PostgreSQL master para Mirror replication SÍNCRONA.
#
# Aplicación:
#   - Append al postgresql.conf del container oficial_master, o
#   - Mountear como /etc/postgresql/postgresql.conf override, o
#   - Usar CMD postgres -c "synchronous_standby_names='oficial_replica'" ...
#
# Después de aplicar: docker restart oficial_master
#
# Decisiones documentadas en docs/architecture/05-replication-mirror.md
# y skill postgresql-mirror-replication.
# ============================================================

# ─── Conexiones ────────────────────────────────────────────
listen_addresses = '*'

# ─── Write-Ahead Log para replicación ──────────────────────
wal_level = replica
max_wal_senders = 10
max_replication_slots = 5
wal_keep_size = 1GB

# ─── Replicación SÍNCRONA obligatoria ──────────────────────
# La réplica se identifica con application_name='oficial_replica' en su
# primary_conninfo (ver 03-replication-replica.sh). Si la réplica
# desaparece, el master BLOQUEA escrituras hasta que vuelva o el
# operador remueva el nombre de aquí. Esto es intencional: garantiza
# RPO=0 para el cómputo oficial (datos legalmente vinculantes).
synchronous_commit = on
synchronous_standby_names = 'oficial_replica'

# ─── Hot standby (la réplica acepta SELECTs) ───────────────
hot_standby = on

# ─── Logs útiles para defensa y demo de failover ───────────
log_connections = on
log_disconnections = on
log_replication_commands = on
log_min_duration_statement = 500ms

# ============================================================
# pg_hba.conf — entradas que el master debe tener
# (no se concatenan acá; van en pg_hba.conf separadamente)
# ============================================================
#
# # Replicación desde la réplica (red Docker)
# host  replication  oficial_replicator  0.0.0.0/0  scram-sha-256
#
# # Aplicación: oficial_writer (API) y dashboard_ro (dashboard general)
# host  oficial      oficial_writer      0.0.0.0/0  scram-sha-256
# host  oficial      dashboard_ro        0.0.0.0/0  scram-sha-256
