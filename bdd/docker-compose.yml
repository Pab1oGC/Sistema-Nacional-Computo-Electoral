services:

  # ══════════════════════════════════════════════════════════════════════════
  # MongoDB Replica Set (3 nodos)
  # ══════════════════════════════════════════════════════════════════════════

  mongo1:
    image: mongo:7.0
    container_name: rrv-mongo1
    hostname: mongo1
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo1_data:/data/db
    command: ["mongod", "--replSet", "rrv-rs", "--bind_ip_all"]
    networks:
      - rrv-net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

  mongo2:
    image: mongo:7.0
    container_name: rrv-mongo2
    hostname: mongo2
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongo2_data:/data/db
    command: ["mongod", "--replSet", "rrv-rs", "--bind_ip_all"]
    networks:
      - rrv-net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

  mongo3:
    image: mongo:7.0
    container_name: rrv-mongo3
    hostname: mongo3
    restart: unless-stopped
    ports:
      - "27019:27017"
    volumes:
      - mongo3_data:/data/db
    command: ["mongod", "--replSet", "rrv-rs", "--bind_ip_all"]
    networks:
      - rrv-net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

  # ══════════════════════════════════════════════════════════════════════════
  # Apache Kafka (KRaft — sin ZooKeeper)
  # ══════════════════════════════════════════════════════════════════════════

  kafka:
    image: apache/kafka:3.7.1
    container_name: rrv-kafka
    restart: unless-stopped
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_LISTENERS: PLAINTEXT://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 104857600
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - rrv-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --list --bootstrap-server localhost:9094 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 15s
      retries: 20
      start_period: 40s

  # ══════════════════════════════════════════════════════════════════════════
  # MinIO (Object Storage S3-compatible)
  # ══════════════════════════════════════════════════════════════════════════

  minio:
    image: minio/minio:latest
    container_name: rrv-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: rrv_admin
      MINIO_ROOT_PASSWORD: rrv_minio_2025
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - rrv-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

# ════════════════════════════════════════════════════════════════════════════
networks:
  rrv-net:
    name: rrv-net
    driver: bridge

volumes:
  mongo1_data:
  mongo2_data:
  mongo3_data:
  kafka_data:
  minio_data:
